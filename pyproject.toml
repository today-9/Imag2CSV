[project]
name = "imag2csv"
version = "0.1.0"
description = "グラフ画像からデータ点を抽出してCSVに変換するGUIツール"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "qtawesome>=1.4.2",
]

[project.scripts]
imag2csv = "imag2csv.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imag2csv"]
